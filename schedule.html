<main>
  <h1 class="page-title">SCHEDULE</h1>
  <div class="content-list" data-content="schedule"></div>
</main>
<div class="schedule-lightbox" id="schedule-lightbox" role="dialog" aria-modal="true" aria-label="イベント画像の拡大表示" aria-hidden="true"><button class="schedule-lightbox-close" type="button" aria-label="閉じる">×</button><img alt=""></div>
<footer><span class="footer-credit">© Hikari Sakashita ｜ 坂下 光</span><a class="footer-bandcamp" href="https://hikari-sakashita.bandcamp.com" target="_blank" rel="noopener noreferrer" aria-label="Bandcamp（新しいタブで開く）" title="Bandcamp"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M8.3 5H24l-8.3 14H0z" fill="currentColor"/></svg></a></footer><script src="assets/main.js"></script>
<script src="assets/content.js"></script>
<script src="assets/render-content.js"></script>

<script>
(function () {
  const viewer = document.getElementById('schedule-lightbox');
  const enlarged = viewer.querySelector('img');
  let previousFocus = null;
  function closeViewer() {
    viewer.classList.remove('is-open');
    viewer.setAttribute('aria-hidden', 'true');
    enlarged.removeAttribute('src');
    document.body.style.overflow = '';
    if (previousFocus) previousFocus.focus();
  }
  document.querySelector('[data-content="schedule"]').addEventListener('click', function (event) {
    const img = event.target.closest('img');
    if (!img || !this.contains(img)) return;
    event.preventDefault();
    previousFocus = document.activeElement;
    enlarged.src = img.currentSrc || img.src;
    enlarged.alt = img.alt || 'イベント画像';
    viewer.classList.add('is-open');
    viewer.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    viewer.querySelector('button').focus();
  });
  viewer.addEventListener('click', function (event) {
    if (event.target === viewer || event.target.closest('.schedule-lightbox-close')) closeViewer();
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && viewer.classList.contains('is-open')) closeViewer();
  });
})();
</script>
