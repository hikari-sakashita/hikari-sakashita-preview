<main><h1 class="page-title">CONTACT</h1>
<div class="contact-wrap">
  <form id="contact-form" action="https://api.web3forms.com/submit" method="POST">
    <!-- Replace the placeholder with your Web3Forms public Access Key before sending. -->
    <input type="hidden" name="access_key" value="59adfd50-0d93-428a-8e21-d5fcf244876c">
    <input type="hidden" name="subject" value="Hikari Sakashita Website — Contact">
    <input type="hidden" name="from_name" value="Hikari Sakashita Website">
    <input type="checkbox" name="botcheck" class="contact-honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="field"><label for="contact-name">NAME / 名前</label><input id="contact-name" name="name" type="text" autocomplete="name" maxlength="120" required></div>
    <div class="field"><label for="contact-email">MAIL / メールアドレス</label><input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required></div>
    <div class="field"><label for="contact-message">MESSAGE / メッセージ</label><textarea id="contact-message" name="message" maxlength="10000" required></textarea></div>
    <div class="contact-captcha"><div class="h-captcha" data-captcha="true"></div></div>
    <button class="submit" type="submit">SEND / 送信</button>
    <p id="contact-status" class="form-status" role="status" aria-live="polite"></p>
  </form>
</div></main>
<footer><span class="footer-credit">© Hikari Sakashita ｜ 坂下 光</span><a class="footer-bandcamp" href="https://hikari-sakashita.bandcamp.com" target="_blank" rel="noopener noreferrer" aria-label="Bandcamp（新しいタブで開く）" title="Bandcamp"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M8.3 5H24l-8.3 14H0z" fill="currentColor"/></svg></a></footer><script src="assets/main.js"></script><script src="https://web3forms.com/client/script.js" async defer></script>
<script>
(function(){
  const form = document.getElementById("contact-form");
  const status = document.getElementById("contact-status");
  const button = form.querySelector("button[type=submit]");
  form.addEventListener("submit", async function(event){
    event.preventDefault();
    if (form.elements.access_key.value.includes("PASTE_YOUR")) {
      status.textContent = "送信設定がまだ完了していません。";
      return;
    }
    button.disabled = true;
    status.textContent = "送信中…";
    try {
      const response = await fetch(form.action, { method: "POST", body: new FormData(form) });
      const result = await response.json();
      if (!response.ok || !result.success) throw new Error(result.message || "送信できませんでした");
      status.textContent = "Message sent successfully. / メッセージを送信しました。";
      form.reset();
      if (window.hcaptcha) window.hcaptcha.reset();
    } catch (error) {
      status.textContent = "Failed to send message. / メッセージを送信できませんでした。";
    } finally { button.disabled = false; }
  });
})();
</script></body></html>
